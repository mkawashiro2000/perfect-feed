<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar · Perfect Feed</title><link rel="canonical" href="https://perfect-feed.kawashiro.dev/buscar/"><script>try{const saved=localStorage.getItem('perfect-feed-theme');document.documentElement.dataset.theme=saved||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day')}catch(e){document.documentElement.dataset.theme='day'}</script><link rel="stylesheet" href="/styles.css?v=dark-grid-20261022"></head><body><header><div class="container header-inner"><a class="brand" href="/">⚡ PERFECT FEED</a><nav><a href="/archivo/">Archivo</a><a href="/feed.xml">RSS</a><button class="theme-toggle" type="button" aria-pressed="false">◐ <span class="theme-label">Oscuro</span></button></nav></div></header><main class="container search"><h1>Buscar en el archivo</h1><label for="q">Título, fuente o tema</label><input id="q" type="search" autofocus><p id="count"></p><div id="results" class="cards"></div></main><script>const themeButton=document.querySelector('.theme-toggle'),themeLabel=document.querySelector('.theme-label');function syncTheme(){const night=document.documentElement.dataset.theme==='night';themeButton.setAttribute('aria-pressed',String(night));themeLabel.textContent=night?'Claro':'Oscuro'}themeButton.addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='night'?'day':'night';try{localStorage.setItem('perfect-feed-theme',document.documentElement.dataset.theme)}catch(e){}syncTheme()});syncTheme();const q=document.querySelector('#q'),r=document.querySelector('#results'),c=document.querySelector('#count');let data=[];fetch('/search-index.json').then(x=>x.json()).then(x=>{data=x;run()});function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function run(){const needle=q.value.toLowerCase().trim(),matches=data.filter(a=>Object.values(a).join(' ').toLowerCase().includes(needle)).slice(0,50);c.textContent=`${matches.length} resultado(s)`;r.innerHTML=matches.map(a=>`<article class="card"><p class="source">${esc(a.source)}</p><h2><a href="${encodeURI(a.url)}" rel="noopener noreferrer">${esc(a.title_es)}</a></h2><p>${esc(a.summary_es)}</p></article>`).join('')}q.addEventListener('input',run)</script></body></html>
