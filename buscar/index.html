<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buscar · Perfect Feed</title><link rel="canonical" href="https://perfect-feed.kawashiro.dev/buscar/">
  <script>try{const saved=localStorage.getItem('perfect-feed-theme');const preferred=matchMedia('(prefers-color-scheme:dark)').matches?'night':'day';document.documentElement.dataset.theme=saved||preferred}catch(e){document.documentElement.dataset.theme='day'}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/"><span class="brand-mark">⚡</span><span>PERFECT FEED</span></a><nav class="site-nav" aria-label="Navegación principal"><a href="/">Inicio</a><a href="/archivo/">Archivo</a><a class="active" href="/buscar/">Buscar</a><a href="/feed.xml">RSS</a></nav><div class="header-actions"><button class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-label">Modo noche</span></button></div></div></header>
<main id="contenido" class="container page-shell">
  <header class="page-hero"><span class="eyebrow">ARCHIVO INDEXADO</span><h1>Encuentra una historia.</h1><p>Busca por título, fuente, categoría o cualquier tema mencionado en nuestros resúmenes.</p></header>
  <div class="search-box"><label for="q">¿Qué quieres encontrar?</label><input id="q" type="search" placeholder="Ej. inteligencia artificial, Fórmula 1…" autocomplete="off" autofocus><output id="count" class="search-count" aria-live="polite">Cargando…</output></div>
  <div id="results" class="search-results"></div>
</main>
<footer class="site-footer"><div class="container footer-grid"><div><a class="brand footer-brand" href="/"><span class="brand-mark">⚡</span><span>PERFECT FEED</span></a><p>Una redacción automática, verificable y local.</p></div><div><span class="eyebrow">NAVEGA</span><nav><a href="/">Inicio</a><a href="/archivo/">Archivo</a><a href="/feed.xml">RSS</a></nav></div></div></footer>
<script>
const root=document.documentElement,themeButton=document.querySelector('.theme-toggle'),themeLabel=document.querySelector('.theme-label');function syncTheme(){const night=root.dataset.theme==='night';themeButton.setAttribute('aria-pressed',String(night));themeLabel.textContent=night?'Modo claro':'Modo noche'}themeButton.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='night'?'day':'night';try{localStorage.setItem('perfect-feed-theme',root.dataset.theme)}catch(e){}syncTheme()});syncTheme();
const input=document.querySelector('#q'),results=document.querySelector('#results'),count=document.querySelector('#count'),labels={programacion:'Programación',tecnologia:'Tecnología',formula1:'Fórmula 1',data_science:'Data Science',economia:'Economía'};let data=[];function escapeHtml(value){const node=document.createElement('div');node.textContent=value||'';return node.innerHTML}function render(){const needle=input.value.toLowerCase().trim(),matches=data.filter(article=>Object.values(article).join(' ').toLowerCase().includes(needle)).slice(0,50);count.textContent=`${matches.length} RESULTADO${matches.length===1?'':'S'}`;results.innerHTML=matches.length?matches.map(article=>`<article class="search-result"><p class="source">${escapeHtml(labels[article.category]||article.category)} · ${escapeHtml(article.source)}</p><h2><a href="${encodeURI(article.url)}" target="_blank" rel="noopener">${escapeHtml(article.title_es)}</a></h2><p>${escapeHtml(article.summary_es)}</p></article>`).join(''):'<div class="empty-state"><h2>No encontramos coincidencias.</h2><p>Prueba con otra fuente, categoría o palabra clave.</p></div>'}fetch('/search-index.json').then(response=>response.json()).then(index=>{data=index;render()}).catch(()=>{count.textContent='SIN CONEXIÓN';results.innerHTML='<div class="empty-state"><h2>No pudimos cargar el índice.</h2><p>Inténtalo de nuevo en unos minutos.</p></div>'});input.addEventListener('input',render);
</script>
</body>
</html>
